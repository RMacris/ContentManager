<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Bloqueador de URLs</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      width: 320px;
      padding: 16px;
      margin: 0;
      background-color: #f4f4f9;
      box-sizing: border-box;
    }
    h1 { font-size: 17px; margin: 0 0 8px; }
    input[type="text"] {
      width: 100%;
      padding: 8px;
      margin: 6px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 12px;
    }
    label { font-size: 12px; color: #444; display: block; margin-top: 8px; }
    button {
      width: 100%;
      padding: 9px;
      margin: 8px 0 0;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      transition: background-color 0.3s ease;
    }
    button:hover { background-color: #45a049; }
    ul { list-style-type: none; padding: 0; margin: 6px 0; }
    li {
      background: #fff;
      margin: 6px 0;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 12px;
      word-break: break-all;
    }
    .remove-btn {
      background-color: #e74c3c;
      padding: 4px 8px;
      font-size: 11px;
      width: auto;
      display: block;
      margin-top: 6px;
    }
    .remove-btn:hover { background-color: #c0392b; }
    .message {
      margin: 8px 0;
      padding: 8px;
      border-radius: 4px;
      font-size: 12px;
      display: none;
    }
    .message.error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    .message.ok { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    hr { border: none; border-top: 1px solid #ddd; margin: 18px 0 0; }
    .hint { font-size: 11px; color: #777; margin: 2px 0 0; line-height: 1.4; }
  </style>
</head>
<body>
  <h1>Bloqueador de URLs</h1>
  <input type="text" id="url" placeholder="Padrão de URL para bloquear">
  <button id="blockUrl">Bloquear URL</button>
  <div id="message" class="message error"></div>
  <ul id="blockedUrlsList"></ul>

  <hr>

  <h1>Filtro do feed</h1>
  <label for="hideOldVideos">
    <input type="checkbox" id="hideOldVideos" checked> Esconder vídeos com mais de 3 dias
  </label>
  <label for="hideGamesAndAds">
    <input type="checkbox" id="hideGamesAndAds" checked> Esconder jogos e anúncios do feed
  </label>
  <p class="hint">Vídeos com 4 dias ou mais, jogos e anúncios somem da home, inscrições, buscas, canais e recomendações. Shorts, histórico e listas salvas não são afetados.</p>
  <div id="filterMessage" class="message"></div>

  <script src="popup.js"></script>
</body>
</html>
